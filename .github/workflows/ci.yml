name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Core tests
        run: dotnet test tests/BdoTimers.Core.Tests
      - name: App build
        run: dotnet build src/BdoTimers.App
